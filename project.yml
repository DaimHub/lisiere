name: Browser
options:
  bundleIdPrefix: dev.athas
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Browser:
    type: application
    platform: macOS
    sources:
      - path: Sources/Browser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.athas.browser
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Browser
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
    entitlements:
      path: Browser.entitlements
  BrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BrowserTests
    dependencies:
      - target: Browser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.athas.browser.tests
        GENERATE_INFOPLIST_FILE: YES
